{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 350px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
        }

        .form-control:focus {
            background: rgba(255,255,255,0.12);
            color: white;
            border-color: #00c6ff;
            box-shadow: 0 0 6px rgba(0,198,255,0.5);
        }

        .btn-success {
            background: linear-gradient(90deg, #00ffcc, #00c6ff);
            border: none;
        }

        a {
            color: #00c6ff;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Signup</h2>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Username" class="form-control mb-3" required>

        <input type="password" name="password" placeholder="Password" class="form-control mb-3" required>

        <button class="btn btn-success w-100">Signup</button>

        <p class="mt-3 text-center">
            Already have an account? <a href="/login/">Login</a>
        </p>

        {% if error %}
            <p style="color:red; text-align:center;">{{ error }}</p>
        {% endif %}
    </form>
</div>

</body>
</html>
